<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="PhishGuard" class="brand-icon">
        <div>
          <h1 class="brand-title">PhishGuard AI</h1>
          <span class="brand-sub">Real-Time Protection</span>
        </div>
      </div>
      <div class="toggle-wrapper">
        <label class="switch" title="Toggle Protection">
          <input type="checkbox" id="protection-toggle" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </header>

    <!-- Protection Status Banner -->
    <div id="status-banner" class="status-banner banner-active">
      <span class="status-dot"></span>
      <span id="status-text">Protection Active</span>
    </div>

    <!-- Current Site Card -->
    <section class="card">
      <div class="card-header">
        <span class="card-title">CURRENT SITE</span>
        <button id="btn-rescan" class="btn-icon" title="Rescan Current Site">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        </button>
      </div>
      <div id="current-domain" class="domain-text truncate">Checking tab...</div>
      
      <div class="score-grid">
        <div class="score-circle-container">
          <div id="score-circle" class="score-circle score-safe">
            <span id="score-value">--</span>
          </div>
          <span class="score-label">Risk Score</span>
        </div>

        <div class="site-meta">
          <div class="meta-row">
            <span class="meta-label">Status:</span>
            <span id="verdict-badge" class="badge badge-safe">SAFE</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">Risk Level:</span>
            <span id="risk-level" class="font-bold text-safe">LOW</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">Category:</span>
            <span id="site-category" class="capitalize">General</span>
          </div>
        </div>
      </div>

      <div id="reasons-container" class="reasons-box hidden">
        <div class="reasons-title">Signals Detected:</div>
        <ul id="reasons-list"></ul>
      </div>
    </section>

    <!-- Stats Bar -->
    <div class="stats-row">
      <div class="stat-pill">
        <span class="stat-num" id="stat-threats-blocked">0</span>
        <span class="stat-desc">Threats Blocked</span>
      </div>
      <div class="stat-pill">
        <span class="stat-num" id="stat-total-scans">0</span>
        <span class="stat-desc">Total Scans</span>
      </div>
    </div>

    <!-- Footer Action Links -->
    <footer class="footer">
      <button id="btn-open-dashboard" class="footer-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Web Dashboard
      </button>
      <button id="btn-open-settings" class="footer-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
